name: lupa_publica
version: "0.1.0"
config-version: 2
profile: lupa_publica

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lupa_publica:
    staging:
      # Parsing the raw JSON is the expensive part, so it happens once, into tables.
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    silver:
      +materialized: table
      +schema: silver

seeds:
  lupa_publica:
    +schema: silver

flags:
  # No usage telemetry: this project is about public data, not about its users.
  send_anonymous_usage_stats: false
